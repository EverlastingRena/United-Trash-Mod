l_russian:
 anorchism:0 "Анорхизм"
 anorchism_noun:0 "Анорхизм"
 anorchism_desc:0 "Безвластие"
 burjuism:0 "Буржуизм"
 burjuism_noun:0 "Буржуизм"
 burjuism_desc:0 "Власть под пятой капитала"
 borshewism:0 "Борщевизм"
 borshewism_noun:0 "Борщевизм"
 borshewism_desc:0 "Диктатура пролетариата"
 bidlo:0 "Быдлоизм"
 bidlo_noun:0 "Быдлоизм"
 bidlo_desc:0 "Диктатура быдла"
 pahanism:0 "Паханизм"
 pahanism_noun:0 "Паханизм"
 pahanism_desc:0 "Режим пахана"
 putinism:0 "Путинизм"
 putinism_noun:0 "Путинизм"
 putinism_desc:0 "Вечный путинский режим"
 
 anarcho_communism:0 "Анархо-коммунизм"
 anarcho_communism_desc:0 "«Нам нужно держаться вместе. Подальше от этих неуклюжих, грубых, толстокожих, несправедливых, равнодушных, истеричных и жестоких созданий»."
 anarcho_borshewism:0 "Анархо-борщевизм"
 anarcho_borshewism_desc:0 "«Если друг настоящий, то он не бросит. А если не настоящий, то и волноваться не о чем»."
 anarcho_bund:0 "Бунтарский анорхизм"
 anarcho_bund_desc:0 "«Кругом одни теоретики! А жизнь, это прежде всего — практика»."
 religious_anorchism:0 "Религиозный анорхизм"
 religious_anorchism_desc:0 "«Говорят, что у каждого есть свой ангел-хранитель. Я раньше не придавал этому особого значения. Интересно, какой он у меня? Жалко, что я его не вижу. Он-то обо мне знает всё! Всё, что я когда-то прятал и скрывал от других! Он всё видел!»"
 anarcho_nihilism:0 "Анархо-нигилизм"
 anarcho_nihilism_desc:0 "«А вдруг окажется, что смысл жизни — не есть сладкого и не спать до двенадцати? Я тогда только расстроюсь...»"
 philosophic_anorchism:0 "Философский анорхизм"
 philosophic_anorchism_desc:0 "«Иногда случается, что вещи теряют свой смысл. Вот смысл окна, например, чтобы в него смотреть. А порой смотришь в него, а смотреть там нечего. Ничего интересного. Или вот, какой смысл умываться по утрам? Чтобы быть бодрым? А какой смысл быть по утрам бодрым? Какой вообще смысл БЫТЬ по утрам? Непонятно. И непонятно, то ли жизнь всегда была бессмысленной, а ты просто не замечал этого, то ли смысл был, но куда-то затерялся»."
 anarcho_egoism:0 "Анархо-эгоизм"
 anarcho_egoism_desc:0 "«Я личность! Понятно? Бесформенная, но личность!»"
 post_leftism:0 "Постлевачество"
 post_leftism_desc:0 "«Барашик, мы создадим мир где каждый будет делать то, что хочет, там не будет никаких конфликтов! Мы оставим сценариста этого сериала без хлеба!»"
 anarcho_primitivism:0 "Анархо-примитивизм"
 anarcho_primitivism_desc:0 "«— Там такая замечательная травка была, а вы её уничтожили! Вы уничтожили целую среду обитания. Вот придут, например, бизоны, а травки-то и нет. Есть-то нечего!\n— Какие бизоны? Что ты придумываешь?\n— Здесь нет никаких бизонов.\n— Эх... Так потому их и нет, что есть нечего»."
 eco_anorchism:0 "Эко-анорхизм"
 eco_anorchism_desc:0 "«Это только кажется, что море большое. На самом деле оно маленькое, бесследно в нем ничего не исчезает»."
 techno_anorchism:0 "Техно-анорхизм"
 techno_anorchism_desc:0 "«Мы сделаем такой «Бац!», что прогресс полетит как ошпаренный! Только пятки засверкают!»"
 pirate_anorchism:0 "Пиратский анорхизм"
 pirate_anorchism_desc:0 "«— Быть моряком — это так потрясно! Плавать по морю, играть с дельфинами, кормить чаек!\n— А потом можно вернуться домой и попросить поэта нам описать всё это в книжке стального цвета!»"
 market_anorchism:0 "Рыночный анорхизм"
 market_anorchism_desc:0 "«Зная, что у меня кое-что припасено на чёрный день, я чувствую себя более спокойным»."
 national_anarchism:0 "Нацианал-анорхизм"
 national_anarchism_desc:0 "«Мы все живём в разных мирах»."
 antijapanism:0 "Антияпонизм"
 antijapanism_desc:0 "«— Послушайте, всё станет пылью, и воюющий с нею превратится в пыль.\n— Время подумать...\n— О вечном, но как всегда...\n— Надо разгребать этот мусор!»"
 terpila_anorchism:0 "Терпильный анорхизм"
 terpila_anorchism_desc:0 "«Похоже, это самая скучная битва добра со злом в истории»."
 analchism:0 "Аналхизм"
 analchism_desc:0 "«Нам нужно больше тратить сил на понимание друг друга, а не на попытки докричаться»."
 anarchism_bez_nikhuya:0 "Анархизм без нихуя"
 anarchism_bez_nikhuya_desc:0 "«Только отказавшись от всех амбиций, отпустив всё суетное и эгоистичное, можно познать суть мироздания»."
 
 liberakha:0 "Либерашкизм"
 liberakha_desc:0 "«А у тебя бывает когда-нибудь такое, что в голове мысли красивые, эффектные, бьющие без промаха, а когда начинаешь их говорить вслух, то получается какая-то белиберда несусветная?»"
 national_liberakha:0 "Нацианал-либерашкизм"
 national_liberakha_desc:0 "«Память есть неотъемлемая часть души. Душа — основополагающая часть пуха, то есть духа. А здравый дух, как вам известно, живёт в здоровом теле»."
 conserva:0 "Консервизм"
 conserva_desc:0 "«Вальсы, твисты, ламбады... Мода меняется. Но моё сердце бьётся только в ритме диско!»"
 american_dream:0 "Американская мечта"
 american_dream_desc:0 "«Для некоторых, заблуждения уютней истины»."
 atlantism:0 "Атлантизм"
 atlantism_desc:0 "«Эх, вот так всегда: когда ты готов спасти мир, на него никто не покушается»."
 social_dermocracy:0 "Социал-дерьмокрадия"
 social_dermocracy_desc:0 "«— Ну... И как ты с этим борешься?\n— Я пока только готовлюсь к борьбе»."
 sjw_system:0 "СЖВ-система"
 sjw_system_desc:0 "«Да у тебя ветер у самой в голове! Такой сквозняк, что если туда ветрогенератор поставить — то всю долину осветить можно будет! Ты... ты просто... гипертрофированная мансипама!»"
 greens:0 "Зелёная политика"
 greens_desc:0 "«— Это глобальное потепление. В Африке растают все айсберги и нас затопит.\n— Дорогая! В Африке нет айсбергов! Они в Арктике!\n— Ну конечно, в Арктике... Хотя Африке от этого только хуже»."
 zoomerism:0 "Зумеризм"
 zoomerism_desc:0 "«Дети, Копатыч, это тебе не лопухи! Они в мусоре не растут!»"
 onlyfansism:0 "Симпизм"
 onlyfansism_desc:0 "«Да, тогда у меня были рога не очень, но сейчас у меня рога хоть куда. Если бы она их сейчас увидела, она бы очень пожалела, что тогда поспешила с выводами!»"
 pedophilia:0 "Анархо-капитализм"
 pedophilia_desc:0 "«Надо Луну что ли в аренду сдать? А то висит как-то… без дела»."
 objectivism:0 "Объективизм"
 objectivism_desc:0 "«Что может быть важнее сокровищ?»"
 right_accelerationism:0 "Правый акселерационизм"
 right_accelerationism_desc:0 "«Когда ждёшь, секунды тянутся медленно, неохотно, как будто издеваются, и, когда ты наконец получаешь то, чего ждал, уже не получаешь от этого никакой радости. Вся наша жизнь — это сплошное ожидание. Мы ждём, когда закипит чайник или наступит вдохновение. Ждём новостей, своей очереди, подходящего момента. Летом — мы ждём зиму, а зимой — лето. Мы ждём свой день рождения, Новый год. Мы ждем, когда наступят выходные. Календарь и часы — самые ужасные изобретения в мире, но не будь их мы бы все равно чего-нибудь ждали»."
 demshiza:0 "Демшиза"
 demshiza_desc:0 "«То получаешь не совсем то, что хочешь; то получаешь, а уже не хочешь; а то и вовсе не знаешь, чего хочешь на самом деле»."
 
 mraxism:0 "Мраксизм"
 mraxism_desc:0 "«Не надо строить иллюзии, которые могут закончиться травмпунктом»."
 orthodox_borshewism:0 "Ортодоксальный борщевизм"
 orthodox_borshewism_desc:0 "«Ведь все беды от чего? От того, что каждый в одном и том же видит разное! Разные смыслы вкладывают, и получаются конфликты. А когда будет смысл один, настоящий, все будут жить дружно!»"
 gribonism:0 "Ленинизм"
 gribonism_desc:0 "«Ерунда! У всех всё одинаково»."
 left_avangardism:0 "Левый авангардизм"
 left_avangardism_desc:0 "«— Куда ты теперь, товарищ?!\n— Туда, где нет решеток и замков! Туда, где всегда сияет беспечное солнце свободы!»"
 vperedism:0 "Впередизм"
 vperedism_desc:0 "«— Вы бы меня ещё на луну отправили!\n— Бараш, что ж ты раньше всем не сказал? Покорение космоса – отличная идея!»"
 sralinism:0 "Сралинизм"
 sralinism_desc:0 "«Крош, если ты будешь со мной спорить, я тебя запишу»."
 samostiynost:0 "Самостийность"
 samostiynost_desc:0 "«Нюша, я почувствовал!... Я почувствовал, что у меня пропала вся посуда!»"
 trotskism:0 "Троцкизм"
 trotskism_desc:0 "«А ты уверен, что это твоё?… Что это твой, так сказать, стиль? Может, хотя бы в Мексику? Там кукурузы много…»"
 posadism:0 "Посадизм"
 posadism_desc:0 "«— Самый полезный опыт, это познать не свой характер, а характер своего друга!\n— И успеть сделать выводы.\n— И-Или ноги»."
 polpotism:0 "Полпотизм"
 polpotism_desc:0 "«— Если мы выживем, нам будет все нипочем!\n— А если нет?\n— Давайте о скучном сейчас думать не будем!»"
 borshewic_nationalism:0 "Борщевистский нацианализм"
 borshewic_nationalism_desc:0 "«Ты — раритет, я — раритет. Выходит, мы с тобой какая-то своеобразная коллекция…»" 
 monarcho_borshevism:0 "Монархо-борщевизм"
 monarcho_borshevism_desc:0 "«Поскольку все королевства уже расхватали, можно стать… принцессой цирка! Был бы только цирк…»"
 war_communism:0 "Военный коммунизм"
 war_communism_desc:0 "«Сейчас ты узнаешь, что такое — боевой кролик в действии!»"
 religious_borshewism:0 "Религиозный борщевизм"
 religious_borshewism_desc:0 "«Когда-нибудь все научатся находить равновесие между своими страстями и равнодушием. Обязательно научатся…»"
 left_dolbolsaviye:0 "Левое долбославие"
 left_dolbolsaviye_desc:0 "«— Меньше знаешь — крепче спишь!\n— В тебе говорит усталый дух! Ты стал старым, чёрствым и равнодушным!»" 
 sex_communism:0 "Секс-коммунизм"
 sex_communism_desc:0 "«В вопросах дружбы размер не имеет значения»."
 donat_borshewism:0 "Донатный борщевизм"
 donat_borshewism_desc:0 "«Ёлки-иголки, как мы только раньше этого не понимали? Вся наша жизнь это сплошные упущенные возможности»."
 alko_borshewism:0 "Алко-борщевизм"
 alko_borshewism_desc:0 "«Ну вот, погоревали, и хватит. Жизнь только начинается!»"
 dermokradic_borshewism:0 "Дерьмокрадский борщевизм"
 dermokradic_borshewism_desc:0 "«Друг мой, а вам не кажется, что мы оба остались при своём... Но при этом наелись мыла?»"
 utopianism:0 "Утопизм"
 utopianism_desc:0 "«Зачем нужна Вселенная, в которой нет чуда?»"
 nostalgic_borshewism:0 "Ностальгический борщевизм"
 nostalgic_borshewism_desc:0 "«Бывают вещи, с которыми очень трудно расстаться. Они уже такие старые, что их давно пора выбросить. Но к ним так привыкаешь, с ними связано столько историй, что кажется выбросить их все равно, что выбросить себя»."
 narodnichestvo:0 "Народничество"
 narodnichestvo_desc:0 "«Весна! Природа оживает. Всё вокруг начинает цвести. Но если природа вас кормит, то бывает, что некогда любоваться её красотами. Нужно пахать, удобрять, сеять, чтобы осенью собрать новый урожай и встретить зиму на сытый желудок»."
 tradeunionism:0 "Синдикализм"
 tradeunionism_desc:0 "«Что ни говори, сосед, а ремонт — дело коллективное!»"
 revolutionary_front:0 "Революционный фронт"
 revolutionary_front_desc:0 "«Тихо! Тихо! Хватит придираться друг к другу, нам всем здесь несладко! Если мы не перестанем ссориться, нам всем здесь каюк! Мы сможем выбраться отсюда только сообща!»"
 angsoc:0 "Английский социализм"
 angsoc_desc:0 "«— Неблагодарный! Мы же тебя спасаем от самого себя!\n— Так говорят все поработители!»"
 gnostic_liberation:0 "Гностическое освобождение"
 gnostic_liberation_desc:0 "«Мне вот иногда кажется, что наш мир кем-то нарисован, и за нами всё время кто-то наблюдает. Вон оттуда»."
 
 nazbol:0 "Нацианал-борщевизм"
 nazbol_desc:0 "«И смотрите у меня – без лишних нежностей! Хоккей – это вам не бальные танцы!»"
 strasserism:0 "Штрассеризм"
 strasserism_desc:0 "«Да я больше овца, чем вы все вместе взятые!»" 
 grazhdane_sssr:0 "Граждане СССР"
 grazhdane_sssr_desc:0 "«Идеальное прошлое живёт только в нашей памяти»."
 right_dolboslaviye:0 "Правое долбославие"
 right_dolboslaviye_desc:0 "«Я вот тут подумал — если я единственный, кто знает правду, значит я единственный, кто сможет её доказать»."
 mrakobesiye:0 "Мракобесие"
 mrakobesiye_desc:0 "«Твоя наука — полная ерунда! Чего из-за неё волноваться? Если ты не откроешь какую-нибудь молекулу, её обязательно откроет кто-то другой»."
 occultism:0 "Оккультизм"
 occultism_desc:0 "«На улице ночь. Звёзды шлют свой свет из неведомых миров. Я чувствую, что не так уж и одинок в этом странном мире»."
 abdulovera:0 "Абдуловера"
 abdulovera_desc:0 "«Нельзя насильно заставить кого-то измениться, даже если он сам об этом просит. В конце концов, если ты созрел, то сможешь измениться и без посторонней помощи, сам»." 
 fashiki:0 "Фашизм"
 fashiki_desc:0 "«Зови меня «Хозяин» – не ошибёшься!»"
 nazi:0 "Нацизм"
 nazi_desc:0 "«Браво, друг мой, браво! Это признание — ваша победа! Это победа вашей воли над обстоятельствами!»"
 lmaoburgsis:0 "Эзотерический нацизм"
 lmaoburgsis_desc:0 "«Не знаю как у вас, а у нас уборка — целое приключение. Стоит только начать, и потом уже не остановиться»."
 toleratedictatorship:0 "Гомо-фашизм"
 toleratedictatorship_desc:0 "«Нет, Ёжик, дружить с девчонкой — это как есть немытую морковку, никогда не знаешь, что с тобой будет в следующий момент»."
 trap_fashiki:0 "Трап-фашизм"
 trap_fashiki_desc:0 "«Я просто выгляжу как лось, а в душе я бабочка!»"
 radical_feminism:0 "Радикальный феминизм"
 radical_feminism_desc:0 "«В этом доме есть мужчина, способный забить в стену гвоздь?!»"
 cute_monarchism:0 "Кьют-манярхизм"
 cute_monarchism_desc:0 "«Я девочка. Я не хочу ничего решать. Я хочу закрыть глаза, а когда открою, чтобы всё было хорошо!»"
 chornaya_sotnya:0 "Черносотенное движение"
 chornaya_sotnya_desc:0 "«Болезнь, как некоторых гостей, надо выводить в самом начале, когда они только пришли, а чемоданы ещё не распаковали, а то потом как поселятся, и уже не поймёшь, кто в доме хозяин»."
 national_burzhuism:0 "Нацианал-буржуизм"
 national_burzhuism_desc:0 "«— У нас, у греков, демократия.\n— Это греческое слово. Оно означает, что всё решает большинство.\n— Есть также замечательное греческое слово «тирания». Оно означает, что решает тот, кто больше всех грек»."
 altright:0 "Альт-райт"
 altright_desc:0 "«Все мы иногда чувствуем одиночество. Нам иногда не хватает собеседника, но это не значит, что мы одиноки на самом деле. Рядом с нами всегда есть тот, кто сможет понять наши переживания, выслушать нас, что-то подсказать. Как правило, одиночество и пустота вокруг нас — это плод нашего воображения. А на самом деле вокруг нас жизнь бьёт ключом, в ожидании когда мы вольёмся в её шумный и свежий поток»." 
 social_darwinism:0 "Социал-дарвинизм"
 social_darwinism_desc:0 "«— А ты, Крош, какой-то бесчувственный! Мог бы пожалеть такого малюточку!\n— А чего это я его должен жалеть? Я считаю, что каждый имеет право запутываться, где угодно и в чём хочет!»"
 senator_armstrong:0 "Взгляды сенатора Армстронга"
 senator_armstrong_desc:0 "«Отстаньте от меня. Вы мне надоели. Все ваши проблемки яйца выеденного не стоят! Вы даже не знаете, что такое настоящая проблема! Я вас ненавижу. Вы сделали меня таким же неврастеником, как и вы… Ну что, получили своё? Сейчас я вам такое скажу, такое!… Всё выскажу!…»"
 iron_dimon:0 "Взгляды Железного Димона"
 iron_dimon_desc:0 "«— Ну, сорняк, держись!\n— Ты сейчас нам за культуру ответишь!»" 
 eco_fashiki:0 "Эко-фашизм"
 eco_fashiki_desc:0 "«А зачем мне быть здоровым? Зачем мне вообще быть, если любая железяка может быть мною лучше, чем я!»" 
 gopniki:0 "Бандитизм"
 gopniki_desc:0 "«У меня такое ощущение, что у кого с совестью нет проблем, у того и с памятью все в порядке»." 
 ebengrad_system:0 "Ебеньградская система"
 ebengrad_system_desc:0 "«Ну-ка, дружненько поднажали! Голод - не тётка! Раз, два! Раз, два!»"
 illuminatism:0 "Иллюминатизм"
 illuminatism_desc:0 "«Тайное общество. Стёклышки и фантики. Ха-ха-ха. Ерунда какая!»"
 horde:0 "Коллективный разум"
 horde_desc:0 "«А вдруг наши чувства — это тоже неисправность, просто сбой в механизме, который можно починить? И тогда у всех будет… всё в порядке?…»"
 chris_chan_system:0 "Взгляды Крис-чана"
 chris_chan_system_desc:0 "«Ёжик! Спаси меня от самого себя!»"
 nuclear_destruction:0 "Ядерный аннигиляционизм"
 nuclear_destruction_desc:0 "«— Но ведь у нас нет технологий, чтобы контролировать ядерную реакцию! Мы не сможем таким образом получить энергию!\n— Эх... А я и не сказал, что мы будем её контролировать»."
 demiurgism:0 "Власть архонтов"
 demiurgism_desc:0 "«— Но ведь вокруг столько всего! Как… Как это ты так… Как это ты к мог… мог всё придумать?\n— Да не так уж много всего вокруг: наша долина, океан, пустыня, горы — особо напрягаться не пришлось. Ну плюс ещё девять персонажей, включая мой собственный физический образ — да и те довольно предсказуемые, что тоже не делает мне чести»."
 
 gachism:0 "Гачимучизм"
 gachism_desc:0 "«Если честно, то в жизни мне повезло лишь однажды, когда я встретил вас — моих друзей»." 
 flexism:0 "Флексизм"
 flexism_desc:0 "«Перед тем, как навсегда уйти из мира иллюзий, я хочу станцевать здесь свой последний танец»."
 radicalcentrism:0 "Радикальный центризм"
 radicalcentrism_desc:0 "«Будущего боятся существа, неуверенные в себе. Прошлого, наоборот, слишком самоуверенные. Настоящее так мимолётно, что его не успеваешь испугаться»."
 dumerism:0 "Думеризм"
 dumerism_desc:0 "«Бывают такие дни, когда ничего не вдохновляет. Всё кажется неинтересным, скучным, да просто раздражает. Хочется отменить все планы и встречи, просто сидеть дома и хандрить в своё удовольствие»."
 postironism:0 "Абсурдизм"
 postironism_desc:0 "«Мир – это выхухоль»."
 avangardism:0 "Авангардизм"
 avangardism_desc:0 "«Очень интересно, но пора заняться делом!»"
 typicalauthoritarism:0 "Диктатура"
 typicalauthoritarism_desc:0 "«О, друг мой наивный, если бы миром правили только те, кто это умеет!»"
 junta:0 "Хунта"
 junta_desc:0 "«Отставить разговоры! Всё нужно делать под команду командира! Раз, два, три! Полундра! Спасите! Помогите!»"
 mercs:0 "Наёмничество"
 mercs_desc:0 "«Герои не выжидают! Подвиг — это действие!»" 	
 occupation_regime:0 "Оккупационный режим"
 occupation_regime_desc:0 "«Иногда для принятия важного решения не хватает самой малости — хорошего пинка!»"
 manyarchism:0 "Манярхизм"
 manyarchism_desc:0 "«Солнце светит — хорошо, не светит — тоже хорошо, я сам себе солнце»."
 russian_traditions:0 "Русский традиционализм"
 russian_traditions_desc:0 "«Им не нужно просто! Ты пойми, у них и так всё просто! Им нужна сказка!»"
 verunstvo:0 "Верунство"
 verunstvo_desc:0 "«Нет! Земля не может быть круглой! Ты только представь: ни слонов, ни черепахи... один глупый шар, который болтается в космосе! Да не может быть! Потому что это НЕ ИНТЕРЕСНО!»"
 techodrochka:0 "Технодрочерство"
 techodrochka_desc:0 "«Глупый природа! Ты не сильнее, ты не мудрее. Ты — просто фи-зи-ка!»"
 tsardemocrasy:0 "Царьковая дерьмокрадия"
 tsardemocrasy_desc:0 "«Я вам помогу, ребята! Я буду командовать!»"
 longism:0 "Лонгизм"
 longism_desc:0 "«Не бойтесь! Всё будет в порядке! Мы обречены на успех!»"
 glongism:0 "Глонгизм"
 glongism_desc:0 "«Нет, со мной не всё в порядке. Не бывает, чтобы у кого-то всё было в порядке»." 
 anarchopunk:0 "Анархо-панк"
 anarchopunk_desc:0 "«Нет никакой справедливости! Для меня так это ясно, как простая гайка! Да, крушите всё — ничего не жалко, битте!»"
 anarcho_manyarchism:0 "Анархо-манярхизм"
 anarcho_manyarchism_desc:0 "«Как это здорово – быть принцессой, все ради тебя совершают подвиги, всякие героические поступки... Пойду-ка я тоже воодушевлю кого-нибудь на подвиги»."
 shueppsh:0 "ШУЕ-ППШ"
 shueppsh_desc:0 "«Ой, не спрашивай, всё равно не поймёшь. Нас, ун... уникумов... уникумей... ой... уй-уй, короче, личностей с необыкновенными способностями трудно понять. Мы же такие... необыкновенные!»"
 dvacherism:0 "Битардизм"
 dvacherism_desc:0 "«— Пин, где мы?…\n— Там, где только мы. Где нас не найдёт, хочешь того или нет, ни один аноним, обещаю»."
 trash_politics:0 "Трэш-политика"
 trash_politics_desc:0 "«С дубом мы обсуждаем серьёзные политические проблемы!»"
 razumism:0 "Разумизм"
 razumism_desc:0 "«Нельзя прятаться от жизни, дружище! Если так думать, то можно никогда не выйти из дома!»"
 
 imperial_putinism:0 "Имперский путинизм"
 imperial_putinism_desc:0 "«Когда я был маленьким, я верил, что вырасту и мне будут горы по плечу и море по колено, что я буду цельный и величественный, как скала! А что в итоге… Я — песчинка…»"
 colonial_putinism:0 "Колониальный путинизм"
 colonial_putinism_desc:0 "«Да что ж за жизнь такая? Мечты сбываются, а переварить ты их не можешь...»"
 eltsynism:0 "Ельцинизм"
 eltsynism_desc:0 "«Очень трудно жить, думая о каждой ошибке, которую ты совершил, поэтому всё плохое забываешь, а помнишь только хорошее — очень удобно, но от себя не уйдёшь»."
 plastic_putinism:0 "Пластиковый путинизм"
 plastic_putinism_desc:0 "«Никаких больше волнений, никаких катастроф и сенсаций! Спокойные и скучные заголовки. Заголовки, которые не кричат, а нежно-нежно шепчут…»"
 oligarhiya:0 "Олигархия"
 oligarhiya_desc:0 "«Мне теперь всегда будет хорошо. Теперь у меня будет столько шоколада, сколько мне надо. Пять! Нет, десять! Нет, сто! Нет, столько, сколько можно! У меня теперь всё будет из шоколада: стол из шоколада и стул из шоколада! Хочется вкусненького — бац, съела стол! Я даже дом из шоколада сделаю! Весь мир будет из шоколада, весь мир!»"
 prikhvatocracy:0 "Прихватократия"
 prikhvatocracy_desc:0 "«— Ёжик, если бы тебе предложили на выбор: немного морковки или хорошее настроение на оставшееся лето, ты бы что выбрал?\n— Конечно, хорошее настроение!\n— Так и запишем: Ёжик отказался от своей части урожая морковки… А если бы предложили немного яблочек или…\n— Яблочек! И много»."
 esoteric_putinism:0 "Эзотерический путинизм"
 esoteric_putinism_desc:0 "«Бывают такие дни, когда весь мир лежит перед тобой, как вкусное пирожное. Всё становится ясно и понятно. Никаких тайн и загадок. И это чувство всезнания переполняет словно, словно... И нужно общение, общение... Потому что, если ты всю эту мудрость кому-нибудь немедленно не расскажешь, то можно просто умолкнуть!»"
 atomic_orthodoxy:0 "Атомное православие"
 atomic_orthodoxy_desc:0 "«Ты можешь быть добрым и наивным, потому что есть тот, кто охраняет твой сон»."
 japanese_putinism:0 "Японский путинизм"
 japanese_putinism_desc:0 "«Как говорят японцы, никто не спотыкается, лёжа в постели. Сейчас или никогда!»"
 western_putinism:0 "Западный путинизм"
 western_putinism_desc:0 "«Ты же знаешь, мы постоянно меняемся... И очень важно помнить, что ты был положительным персонажем...»"
 duginism:0 "Четвёртая политическая теория"
 duginism_desc:0 "«Ничего не понимаю, но, похоже, нас ожидает что-то эпическое»."
 left_putinism:0 "Красный путинизм"
 left_putinism_desc:0 "«— Ну вы и фрукты!\n— На самом деле, он уже почти овощ»."
 securocracy:0 "Секьюрократия"
 securocracy_desc:0 "«— Лучшего места для засады не найти!\n— Я против! Надо разобраться.\n— Вот и я про то же. Поймаем — разберемся»."
 roskomnadzor:0 "Система Роскомнадзора"
 roskomnadzor_desc:0 "«У кого чистая совесть — тому скрывать нечего! Показывай!»"
 morgenshterism:0 "Моргенштеризм"
 morgenshterism_desc:0 "«Неужели трудно понять? Я выражался фигурально, то есть говорил не то, что думал!»"
 
 
